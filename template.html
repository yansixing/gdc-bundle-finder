<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDC Bundle Finder</title>
<meta name="description" content="Search every file in the Sonniss #GameAudioGDC free bundles (2015–2026), preview single files, and see exactly which zip part to download. 搜索 Sonniss GDC 免费音效包里的每一个文件，单文件试听，直接看到该下哪一卷。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#161B22; --ink-2:#4C5561; --muted:#7A8391;
  --line:#D7DCE3; --line-2:#E6EAEF; --accent:#C2451E; --accent-ink:#FFFFFF; --accent-soft:#FBE9E2;
  --ok:#2E7D4F; --ok-soft:#E3F3E9;
  --focus:#2E6BD6; --mark:#FFE9A8; --mark-ink:#3A2A00; --shadow:rgba(20,26,34,.12);
  --font-display:"Bricolage Grotesque","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1A2029; --surface-2:#20272F; --ink:#E9ECF0; --ink-2:#B4BCC6; --muted:#7F8A97;
    --line:#2C3540; --line-2:#242C36; --accent:#F07A52; --accent-ink:#1A0E08; --accent-soft:#3A2119;
    --ok:#5FC98A; --ok-soft:#1D3527;
    --focus:#6FA1FF; --mark:#5A4A12; --mark-ink:#FFF1C2; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2029; --surface-2:#20272F; --ink:#E9ECF0; --ink-2:#B4BCC6; --muted:#7F8A97;
  --line:#2C3540; --line-2:#242C36; --accent:#F07A52; --accent-ink:#1A0E08; --accent-soft:#3A2119;
  --ok:#5FC98A; --ok-soft:#1D3527;
  --focus:#6FA1FF; --mark:#5A4A12; --mark-ink:#FFF1C2; --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.has-player{padding-bottom:84px}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input{font:inherit;color:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-top:22px;padding-bottom:18px}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;grid-column:1 / -1}
.brand .ctl{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
h1{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
h1 span{color:var(--accent)}
.lede{margin:0;color:var(--ink-2);max-width:62ch}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:5px;padding:5px 10px;background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);cursor:default}
.chip.on i{background:var(--ok)}
.stats{display:flex;gap:22px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.stats b{display:block;font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--ink);line-height:1.1}
.stats small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.top .wrap{grid-template-columns:1fr}.stats{gap:16px;flex-wrap:wrap}}

/* search bar */
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.searchbar .wrap{display:flex;gap:10px;padding-top:12px;padding-bottom:12px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 12px;height:44px}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search .clear{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px}
.search .clear:hover{color:var(--ink);background:var(--surface-2)}
.hint{font-size:12px;color:var(--muted);white-space:nowrap}
.hint code{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line-2);padding:1px 5px;border-radius:3px}
@media (max-width:760px){.hint{display:none}}

/* layout */
.main{display:grid;grid-template-columns:230px 1fr;gap:28px;padding-top:22px;padding-bottom:60px}
@media (max-width:820px){.main{grid-template-columns:1fr;gap:16px}}

/* filters */
.filters{position:sticky;top:70px;align-self:start}
@media (max-width:820px){.filters{position:static}}
.flabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.years{display:flex;flex-direction:column;gap:4px}
@media (max-width:820px){.years{flex-direction:row;flex-wrap:wrap}}
.year{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid transparent;border-radius:5px;padding:6px 10px;background:transparent;cursor:pointer;text-align:left;width:100%;font-variant-numeric:tabular-nums}
@media (max-width:820px){.year{width:auto}}
.year:hover{background:var(--surface)}
.year[aria-pressed="true"]{background:var(--surface);border-color:var(--line);font-weight:600}
.year .n{color:var(--muted);font-size:12px}
.year[aria-pressed="true"] .n{color:var(--ink-2)}
.parts{margin-top:14px;display:none}
.parts.show{display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.part{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 0;text-align:center;cursor:pointer;font-family:var(--font-mono);font-size:12px}
.part[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.reset{margin-top:14px;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:13px}
.reset:hover{text-decoration:underline}

/* answer strip */
.answer{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:14px 16px;margin-bottom:18px}
.answer h2{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 0 8px;letter-spacing:-.005em}
.answer h2 em{font-style:normal;color:var(--accent)}
.zips{display:flex;flex-wrap:wrap;gap:8px}
.zip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:5px;padding:6px 10px;background:var(--surface-2);text-decoration:none;font-variant-numeric:tabular-nums}
.zip:hover{border-color:var(--ink-2)}
.zip .tag{font-family:var(--font-mono);font-size:12px;font-weight:500;background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:3px}
.zip .gb{color:var(--muted);font-size:12px}
.zip .hits{color:var(--ink-2);font-size:12px}
.answer .note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}

/* results */
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meta .sort{display:flex;gap:6px}
.meta .sort button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.meta .sort button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}
.lib header{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.lib .tag{font-family:var(--font-mono);font-size:12px;font-weight:500;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:3px;white-space:nowrap}
.lib .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.lib .name .sup{color:var(--muted);font-weight:400}
.lib .count{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.files{list-style:none;margin:0;padding:4px 0}
.files li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:3px 14px 3px 10px;font-family:var(--font-mono);font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.files li:nth-child(even){background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.files .sz{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.files .more{font-family:var(--font-body);color:var(--ink-2);grid-template-columns:1fr auto;padding-left:14px}
.files .more button{border:0;background:transparent;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.play{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink-2);padding:0;flex:none}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play svg{width:11px;height:11px;fill:currentColor;display:block}
.play[data-state="loading"]{border-color:var(--accent);color:var(--accent)}
.play[data-state="loading"] svg{animation:spin 1s linear infinite}
.play[data-state="playing"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.play[data-state="loading"] svg{animation:none}}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.showmore{display:block;width:100%;margin-top:6px;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:10px;cursor:pointer;color:var(--ink-2)}
.showmore:hover{background:var(--surface)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;margin-bottom:6px}

/* overview (no query) */
.overview{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.overview table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.overview th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.overview td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.overview tr:last-child td{border-bottom:0}
.overview td.num{text-align:right;white-space:nowrap}
.overview th.num{text-align:right}
.overview .yr{font-family:var(--font-display);font-weight:700;font-size:15px}
.overview .yr button{border:0;background:transparent;padding:0;cursor:pointer;font:inherit;color:var(--accent)}
.overview .yr button:hover{text-decoration:underline}
.overview .ex{color:var(--muted);font-size:12.5px;max-width:52ch}
.tablewrap{overflow-x:auto}
.tips{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tips li{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);color:var(--ink-2);font-size:13px}
.tips b{color:var(--ink);display:block;margin-bottom:2px}
.tips button{border:0;background:transparent;padding:0;font:inherit;color:var(--accent);cursor:pointer;font-family:var(--font-mono);font-size:12.5px}
.tips button:hover{text-decoration:underline}
.tips button.txt{font-family:var(--font-body);font-weight:600}

/* player bar */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px var(--shadow)}
.player .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:10px 20px}
.player .big{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;padding:0}
.player .big svg{width:15px;height:15px;fill:currentColor;display:block}
.player .big[data-state="loading"] svg{animation:spin 1s linear infinite}
.player .info{min-width:0}
.player .name{font-family:var(--font-mono);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .bar{height:6px;background:var(--line-2);border-radius:3px;cursor:pointer;position:relative;margin-top:6px}
.player .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--line);border-radius:3px;width:0}
.player .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;width:0}
.player .right{display:flex;align-items:center;gap:12px}
.player .time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2);white-space:nowrap}
.player .x{border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--muted)}
.player .x:hover{color:var(--ink)}

/* preview-mode modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.5);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:600px;width:100%;padding:22px 24px;box-shadow:0 20px 50px var(--shadow)}
.modal h3{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
.modal p{margin:0 0 6px;color:var(--ink-2)}
.modal ol{padding-left:22px;margin:12px 0 0;display:grid;gap:10px;color:var(--ink)}
.modal ol li::marker{color:var(--accent);font-weight:700}
.modal .why{font-size:12.5px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
.bm{display:inline-block;padding:6px 12px;border:1.5px dashed var(--accent);border-radius:5px;color:var(--accent);font-weight:600;text-decoration:none;cursor:grab;background:var(--accent-soft)}
.golink{display:inline-block;padding:6px 12px;border-radius:5px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn2{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:6px 12px;cursor:pointer}

/* footer */
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.foot .wrap{padding-top:18px;padding-bottom:28px;display:grid;gap:6px;max-width:1180px}
.foot p{margin:0;max-width:90ch}
.foot a{color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.lib,.zip{transition:border-color .12s}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">

<script>
(function(){
  const SITE = 'https://yansixing.github.io/gdc-bundle-finder/';
  const PV_HOST = 'downloads.sonniss.com';
  const PV_URL = 'https://downloads.sonniss.com/gdc-finder';
  const PREVIEW = location.hostname === PV_HOST;
  const BOOKMARKLET = "javascript:(function(){if(location.hostname!=='"+PV_HOST+"'){alert('Open "+PV_URL+" first, then click this bookmark.');return;}fetch('"+SITE+"index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(h){document.open();document.write(h);document.close();});})();";

  const I18N = {
    en: {
      lede: 'Every file in the Sonniss #GameAudioGDC free bundles, 2015 to 2026, indexed by which zip it lives in. Search, preview single files, then download only the parts you need.',
      st_files:'audio files', st_libs:'libraries', st_zips:'zip parts', st_gb:'GB total',
      placeholder:'creak wood, cave drone, footsteps gravel, -car …',
      hint:'Words are ANDed · <code>-word</code> excludes · <code>"exact phrase"</code>',
      f_year:'Bundle year', f_part:'Zip part', f_reset:'Clear filters', libs:'libs',
      answer:(z,gb,n)=>'Download <em>'+z+' zip'+(z>1?'s':'')+'</em> ('+gb+' GB) to get all '+n+' matching files',
      note:'Links go straight to Sonniss’s servers. Sorted by year, then part — the top of this list is usually the highest-value download.',
      hits:n=>n+' hit'+(n>1?'s':''), files:n=>n+' file'+(n>1?'s':''),
      meta:(l,f)=>l+' librar'+(l===1?'y':'ies')+' · '+f+' files',
      sort_year:'Year &amp; part', sort_hits:'Most hits',
      show_all:n=>'Show all '+n+' files', more_libs:n=>'Show '+n+' more libraries',
      empty:'<b>Nothing matches.</b>Try fewer words, or a broader term — library names are often generic ("Rocks", "Wind"), file names are specific.',

  function detectLang(){

    try { const s = localStorage.getItem('gdc-lang'); if (s==='zh'||s==='en') return s; } catch(e){}

  // ---- URL hash sync
  function readHash(){
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));

    input.value = state.q;
  }
  function hashString(){
    const h = new URLSearchParams();
    if (state.q) h.set('q', state.q); if (state.year) h.set('y', state.year); if (state.part) h.set('p', state.part);
    if (L==='zh') h.set('lang','zh');

  }
  function writeHash(){ const s=hashString(); history.replaceState(null, '', s || location.pathname + location.search); }

  // ---- query parsing
  function parse(q){
    const inc=[], exc=[]; const re=/-?"[^"]+"|\S+/g; let m;
    while((m=re.exec(q))){ let x=m[0]; let neg=false; if(x.startsWith('-')){neg=true;x=x.slice(1);} x=x.replace(/^"|"$/g,'').toLowerCase(); if(!x) continue; (neg?exc:inc).push(x); }
    return {inc, exc};
  }

  // ---- search
  function run(){
    const {inc, exc} = parse(state.q);
    const hasQ = inc.length>0 || exc.length>0;
    const hitLibs = new Map();
    for(let li=0; li<libByIdx.length; li++){
      const l = libByIdx[li];
      if(state.year && l[0]!==state.year) continue;
      if(state.part && l[1]!==state.part) continue;
      const fl = filesByLib[li] || [];
      if(!hasQ){ hitLibs.set(li, fl); continue; }
      const libHay = libLower[li];
      const libAllInc = inc.every(x=>libHay.includes(x));
      const out=[];
      for(const fi of fl){
        const hay = libHay+' '+fileLower[fi];
        if(exc.some(x=>hay.includes(x))) continue;
        if(libAllInc || inc.every(x=>hay.includes(x))) out.push(fi);
      }
      if(out.length) hitLibs.set(li, out);
    }

  }

  // ---- helpers
  function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    return s.split(re).map((p,i)=> i%2 ? '<mark>'+esc(p)+'</mark>' : esc(p)).join('');
  }
  function splitName(n){ const i=n.indexOf(' - '); return i>0 ? [n.slice(0,i), n.slice(i+3)] : ['', n]; }

  // ---- render

  function render(hitLibs, inc, hasQ){

    const zipHits = {};

    if(hasQ){
      const gbSum = zipKeys.reduce((a,k)=>{const [y,p]=k.split('/');return a+zipInfo[y][p][0];},0);
      html += '<div class="answer"><h2>'+t('answer')(zipKeys.length, gbSum.toFixed(1), nFiles.toLocaleString())+'</h2><div class="zips">';
      for(const k of zipKeys){ const [y,p]=k.split('/'); const z=zipInfo[y][p];
        html += '<a class="zip" href="'+z[1]+'" title="'+t('direct')+'"><span class="tag">'+zipLabel(y,p)+'</span><span class="gb">'+z[0].toFixed(2)+' GB</span><span class="hits">'+t('hits')(zipHits[k])+'</span></a>'; }
      html += '</div><p class="note">'+t('note')+'</p></div>';
    }

    let libs = [...hitLibs.keys()];
    if(state.sort==='hits') libs.sort((a,b)=>hitLibs.get(b).length-hitLibs.get(a).length);
    else libs.sort((a,b)=>{ const A=libByIdx[a],B=libByIdx[b]; return YEARS.indexOf(A[0])-YEARS.indexOf(B[0]) || A[1]-B[1] || A[2].localeCompare(B[2]); });

    html += '<div class="meta"><span>'+t('meta')(hitLibs.size, nFiles.toLocaleString())+'</span><span class="sort" role="group"><button type="button" data-sort="year" aria-pressed="'+(state.sort==='year')+'">'+t('sort_year')+'</button><button type="button" data-sort="hits" aria-pressed="'+(state.sort==='hits')+'">'+t('sort_hits')+'</button></span></div>';

    const show = libs.slice(0, PAGE_LIBS);
    for(const li of show) html += libCard(li, hitLibs.get(li), inc);
    if(libs.length > PAGE_LIBS) html += '<button class="showmore" type="button" id="morelibs">'+t('more_libs')(libs.length-PAGE_LIBS)+'</button>';

  function libCard(li, fl, inc){
    const l=libByIdx[li]; const [sup,name]=splitName(l[2]); const z=zipInfo[l[0]][l[1]];

  // ---- player
  const P = { ac:null, fi:null, buf:null, src:null, startAt:0, offset:0, playing:false, loading:null, cache:new Map(), raf:0 };
  const pl = { box:$('#player'), btn:$('#pbtn'), name:$('#pname'), sub:$('#psub'), bar:$('#pbar'), load:$('#pload'), fill:$('#pfill'), time:$('#ptime'), close:$('#pclose') };
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  async function rfetch(u, range, signal){
    let last='';
    for(let k=0;k<5;k++){

  const u16=(b,o)=>b[o]|b[o+1]<<8, u32=(b,o)=>(b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0;
  function fmt(s){ s=Math.max(0,s|0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  function ctx(){ if(!P.ac) P.ac = new (window.AudioContext||window.webkitAudioContext)(); return P.ac; }

  async function loadBuffer(fi, signal){
    if(P.cache.has(fi)) return P.cache.get(fi);
    const f=files[fi]; const l=libByIdx[f[0]]; const url=zipInfo[l[0]][l[1]][1]; const method=f[3], cs=f[4], off=f[5];
    const mb=(cs/2**20).toFixed(1);
    pl.sub.textContent = t('p_fetch')(mb); pl.load.style.width='0%';
    const lh = new Uint8Array(await (await rfetch(url,'bytes='+off+'-'+(off+29),signal)).arrayBuffer());
    if(u32(lh,0)!==0x04034b50) throw new Error('bad zip entry');
    const dataStart = off+30+u16(lh,26)+u16(lh,28);
    const r = await rfetch(url,'bytes='+dataStart+'-'+(dataStart+cs-1),signal);
    let got=0;
    const counted = r.body.pipeThrough(new TransformStream({ transform(chunk,c){ got+=chunk.byteLength; pl.load.style.width=Math.min(100,got/cs*100).toFixed(1)+'%'; c.enqueue(chunk); } }));
    const stream = method===8 ? counted.pipeThrough(new DecompressionStream('deflate-raw')) : counted;
    const raw = await new Response(stream).arrayBuffer();
    pl.load.style.width='100%'; pl.sub.textContent = t('p_decode');
    const buf = await ctx().decodeAudioData(raw);
    if(P.cache.size>=6) P.cache.delete(P.cache.keys().next().value);
    P.cache.set(fi, buf);
    return buf;
  }
  function stopSource(){ if(P.src){ try{P.src.onended=null; P.src.stop();}catch(e){} P.src=null; } P.playing=false; cancelAnimationFrame(P.raf); }

    const s=ac.createBufferSource(); s.buffer=P.buf; s.connect(ac.destination); s.start(0, offset);
    s.onended=()=>{ if(P.src===s){ P.playing=false; P.offset=0; pl.fill.style.width='0%'; syncPlayButtons(); pl.btn.innerHTML=PLAY_SVG; pl.btn.dataset.state='idle'; pl.time.textContent='0:00 / '+fmt(P.buf.duration); } };
    P.src=s; P.startAt=ac.currentTime-offset; P.offset=offset; P.playing=true;
    pl.btn.innerHTML=PAUSE_SVG; pl.btn.dataset.state='playing'; tick(); syncPlayButtons();
  }
  function tick(){
    if(!P.playing||!P.buf) return;
    const pos=Math.min(P.buf.duration, ctx().currentTime-P.startAt);
    pl.fill.style.width=(pos/P.buf.duration*100)+'%'; pl.time.textContent=fmt(pos)+' / '+fmt(P.buf.duration);
    P.raf=requestAnimationFrame(tick);
  }
  function pause(){ if(!P.playing) return; P.offset=ctx().currentTime-P.startAt; stopSource(); pl.btn.innerHTML=PLAY_SVG; pl.btn.dataset.state='paused'; syncPlayButtons(); }
  function syncPlayButtons(){
    document.querySelectorAll('.play').forEach(b=>{ const fi=+b.dataset.fi; let st='idle';
      if(fi===P.fi){ st = P.loading ? 'loading' : (P.playing ? 'playing' : 'idle'); }
      b.dataset.state=st; b.innerHTML = st==='loading' ? SPIN_SVG : st==='playing' ? PAUSE_SVG : PLAY_SVG; });
  }
  async function play(fi){
    if(!PREVIEW){ openModal(); return; }
    if(fi===P.fi){ if(P.loading){ P.loading.abort(); P.loading=null; P.fi=null; syncPlayButtons(); pl.btn.dataset.state='idle'; pl.btn.innerHTML=PLAY_SVG; return; } if(P.playing) pause(); else startAt(P.offset); return; }
    const f=files[fi];
    if(f[4] > 150*2**20 && !confirm(t('p_big')((f[4]/2**20).toFixed(0)))) return;
    if(P.loading) P.loading.abort();
    stopSource(); P.fi=fi; P.buf=null; P.offset=0;
    const ctl=new AbortController(); P.loading=ctl;
    pl.box.hidden=false; document.body.classList.add('has-player');
    pl.name.textContent=f[1]; pl.time.textContent='0:00 / 0:00'; pl.fill.style.width='0%'; pl.btn.innerHTML=SPIN_SVG; pl.btn.dataset.state='loading'; syncPlayButtons();
    try{
      const buf=await loadBuffer(fi, ctl.signal);
      if(P.loading!==ctl) return;
      P.loading=null; P.buf=buf;
      pl.sub.textContent=t('p_ready')(buf.sampleRate, buf.numberOfChannels, f[2].toFixed(1));
      startAt(0);
    }catch(e){
      if(e.name==='AbortError') return;
      P.loading=null; P.fi=null; pl.btn.innerHTML=PLAY_SVG; pl.btn.dataset.state='idle'; pl.sub.textContent=t('p_err')(e.message||e); syncPlayButtons();
    }
  }
  pl.btn.addEventListener('click', ()=>{ if(P.fi==null) return; if(P.loading){ play(P.fi); return; } if(P.playing) pause(); else if(P.buf) startAt(P.offset); });
  pl.bar.addEventListener('click', e=>{ if(!P.buf) return; const r=pl.bar.getBoundingClientRect(); const frac=(e.clientX-r.left)/r.width; startAt(Math.max(0,Math.min(P.buf.duration-0.05, frac*P.buf.duration))); });
  pl.close.addEventListener('click', ()=>{ if(P.loading){P.loading.abort();P.loading=null;} stopSource(); P.fi=null; P.buf=null; pl.box.hidden=true; document.body.classList.remove('has-player'); syncPlayButtons(); });
  document.addEventListener('keydown', e=>{ if(e.code==='Space' && P.fi!=null && document.activeElement!==input && !e.target.closest('button,a')){ e.preventDefault(); pl.btn.click(); } });

  // ---- events
  let tm; input.addEventListener('input', ()=>{ clearTimeout(tm); tm=setTimeout(()=>{ state.q=input.value.trim(); writeHash(); run(); }, 120); });
  clearBtn.addEventListener('click', ()=>{ input.value=''; state.q=''; writeHash(); run(); input.focus(); });
  yearsEl.addEventListener('click', e=>{ const b=e.target.closest('.year'); if(!b) return; state.year = state.year===b.dataset.y ? null : b.dataset.y; state.part=null; writeHash(); run(); });
  pgrid.addEventListener('click', e=>{ const b=e.target.closest('.part'); if(!b) return; const p=+b.dataset.p; state.part = state.part===p ? null : p; writeHash(); run(); });
  resetBtn.addEventListener('click', ()=>{ state.year=null; state.part=null; writeHash(); run(); });
  document.querySelector('.lang').addEventListener('click', e=>{ const b=e.target.closest('[data-lang]'); if(!b||b.dataset.lang===L) return; L=b.dataset.lang; try{localStorage.setItem('gdc-lang',L);}catch(x){} applyLang(); writeHash(); run(); });
  pvchip.addEventListener('click', ()=>{ if(!PREVIEW) openModal(); });
  $('#pvclose').addEventListener('click', closeModal);
  pvmodal.addEventListener('click', e=>{ if(e.target===pvmodal) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !pvmodal.hidden) closeModal(); });
  results.addEventListener('click', e=>{
    const pb=e.target.closest('.play'); if(pb){ play(+pb.dataset.fi); return; }
    const ph=e.target.closest('[data-pvhelp]'); if(ph){ openModal(); return; }
    const s=e.target.closest('[data-sort]'); if(s){ state.sort=s.dataset.sort; run(); return; }
    const y=e.target.closest('[data-year]'); if(y){ state.year=y.dataset.year; state.part=null; writeHash(); run(); return; }
    const q=e.target.closest('[data-q]'); if(q){ input.value=q.dataset.q; state.q=q.dataset.q; writeHash(); run(); return; }
    const x=e.target.closest('[data-expand]'); if(x){ const li=+x.dataset.expand; const card=results.querySelector('.lib[data-li="'+li+'"]'); const fl=results._hit.get(li); card.querySelector('.files').innerHTML = fl.map(fi=>fileRow(fi, results._inc)).join(''); syncPlayButtons(); return; }
    const m=e.target.closest('#morelibs'); if(m){ const libs=JSON.parse(results.dataset.libs); const done=results.querySelectorAll('.lib').length; const next=libs.slice(done, done+PAGE_LIBS); m.insertAdjacentHTML('beforebegin', next.map(li=>libCard(li, results._hit.get(li), results._inc)).join('')); const left=libs.length-done-next.length; if(left>0) m.textContent=t('more_libs')(left); else m.remove(); syncPlayButtons(); }
  });
  window.addEventListener('hashchange', ()=>{ readHash(); run(); });
  document.addEventListener('keydown', e=>{ if(e.key==='/' && document.activeElement!==input){ e.preventDefault(); input.focus(); } });

  L = detectLang(); readHash(); applyLang(); run();
})();
</script>
